name: Verify native iOS (manual)
on:
  workflow_dispatch:
jobs:
  portable-core:
    runs-on: ubuntu-22.04
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Core
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: Backend
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select installed stable Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,re
          choices=[]
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              if 'beta' in path.name.lower(): continue
              binary=path/'Contents/Developer/usr/bin/xcodebuild'
              result=subprocess.check_output([str(binary),'-version'],text=True)
              match=re.search(r'Xcode (\d+)\.(\d+)',result)
              if match and int(match[1])>=26: choices.append(((int(match[1]),int(match[2])),path))
          if not choices: raise SystemExit('Runner has no stable Xcode 26+. Update the runner image.')
          subprocess.run(['sudo','xcode-select','-s',str(max(choices)[1]/'Contents/Developer')],check=True)
          PY
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data=json.load(open('/tmp/simulators.json'))
          for runtime,devices in sorted(data['devices'].items(),reverse=True):
              if 'iOS-26' not in runtime: continue
              for device in devices:
                  if 'iPhone' in device['name']:
                      print('SIM_DESTINATION=platform=iOS Simulator,id='+device['udid'])
                      raise SystemExit
          raise SystemExit('Install an iOS 26 iPhone Simulator runtime')
          PY
      - name: Boot the selected simulator
        timeout-minutes: 6
        run: xcrun simctl bootstatus "${SIM_DESTINATION##*id=}" -b
      - name: Compile, check cold launches, and test persistence
        timeout-minutes: 15
        run: bash Scripts/test-ios.sh "$SIM_DESTINATION"
      - name: Preserve simulator launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FantasyGlass-simulator-diagnostics
          path: |
            build/launch-checks
            build/Tests-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
