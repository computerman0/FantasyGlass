name: Inspect simulator launch diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Verify run containing simulator diagnostics
        required: true
        default: '39152794747'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FantasyGlass-simulator-diagnostics
          path: diagnostics
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect simulator launch output
        run: |
          python3 - <<'PY'
          import base64, textwrap
          from pathlib import Path
          for pattern in ['*.log', '*.ips', '*.crash']:
              for path in Path('diagnostics').rglob(pattern):
                  print(path)
                  print(path.read_text())
          for path in Path('diagnostics').rglob('*.png'):
              if path.name not in ['native.png', 'container.png']: continue
              print('SCREENSHOT_BEGIN ' + path.name)
              print('\n'.join(textwrap.wrap(base64.b64encode(path.read_bytes()).decode(), 120)))
              print('SCREENSHOT_END ' + path.name)
          PY
